name: 株価データ更新

on:
  schedule:
    # UTC 8時 = 日本時間 17:00 (東証大引け後)。平日のみ。
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      run_budget_minutes:
        description: "今回の実行で株価取得に使う時間(分)。全銘柄が早く揃う代わりに実行時間が伸びる"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_REQUESTS_PER_MINUTE: "5"
      RUN_BUDGET_MINUTES: ${{ inputs.run_budget_minutes || '20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r scripts/requirements.txt

      - name: 株価を取得してデータベースを更新
        working-directory: scripts
        run: python fetch_prices.py

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db data/latest.json data/history
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 株価データ更新 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
