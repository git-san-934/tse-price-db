name: 手動CSV取り込み

on:
  push:
    branches: [main]
    paths:
      - "data/manual_csv/*.csv"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r scripts/requirements.txt

      - name: 手動CSVを取り込んでデータベースを更新
        working-directory: scripts
        run: python import_manual_csv.py

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db data/latest.json data/history
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 手動CSV取り込み ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
